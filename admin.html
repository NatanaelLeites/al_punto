<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al Punto | Panel de Administración</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-container" class="admin-container">
    <div class="admin-card">
      <h2>🔑 Acceso Administración</h2>
      <p>Ingresá con tu cuenta para gestionar el menú y los precios.</p>
      <form id="login-form">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="login-email" required placeholder="admin@alpunto.com" />
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-primary">Ingresar</button>
        <p id="login-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL (OCULTO HASTA INICIAR SESIÓN) -->
  <div id="dashboard-container" class="dashboard hidden">
    <header class="dash-header">
      <div class="container dash-header-inner">
        <h2>Panel Al Punto</h2>
        <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
      </div>
    </header>

    <main class="container dash-content">
      <!-- 1. CONFIGURACIÓN GENERAL Y PRECIOS -->
      <section class="admin-section">
        <h3>💰 Precios y Configuración</h3>
        <form id="config-form">
          <div class="form-group">
            <label>Precio Vianda Individual ($)</label>
            <input type="number" id="cfg-unit-price" required />
          </div>
          <div class="form-group">
            <label>Precio Promo Semanal c/u ($)</label>
            <input type="number" id="cfg-promo-price" required />
          </div>
          <div class="form-group">
            <label>Número de WhatsApp (con código de país, sin +)</label>
            <input type="text" id="cfg-whatsapp" required placeholder="59899123456" />
          </div>
          <button type="submit" class="btn-primary">Guardar Cambios</button>
        </form>
      </section>

      <!-- 2. GESTIÓN DE FOTOS Y GALERÍA -->
      <section class="admin-section">
        <h3>📸 Subir Nueva Foto</h3>
        <form id="upload-form">
          <div class="form-group">
            <label>Seleccionar imagen del plato</label>
            <input type="file" id="image-file" accept="image/*" required />
          </div>
          <div class="form-group">
            <label>Título / Descripción del plato</label>
            <input type="text" id="image-title" required placeholder="Ej: Canelones gratinados" />
          </div>
          <button type="submit" class="btn-primary">Subir a la Web</button>
        </form>
      </section>

      <!-- 3. MENÚ SEMANAL -->
      <section class="admin-section">
        <h3>🍽️ Editar Menú Semanal</h3>
        <div class="form-group">
          <label>Seleccionar Día</label>
          <select id="select-day">
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
          </select>
        </div>
        <div class="form-group">
          <label>Platos del día (separados por renglón)</label>
          <textarea id="day-dishes-input" rows="4" placeholder="Plato 1&#10;Plato 2&#10;Plato 3"></textarea>
        </div>
        <button id="save-menu-btn" class="btn-primary">Guardar Menú del Día</button>
      </section>
    </main>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
